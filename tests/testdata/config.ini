# Example config used by the Smokey tests
[direction_markers]
original=io.metafence,de.micwin

[full.base-domain]
original=io.metafence
anonymized=custA.example

[full.mgmt-namespace]
original=de.micwin.core
anonymized=tenant-42.core

# Hint patterns are case-insensitive regular expressions
[hint.namespaces]
hint=ns-prod-[a-z0-9]+
prefix=NSX
width=3
next_index=1

# Replace only "metafence" before ".net" and keep the rest of the domain
[hint.metafence]
hint=metafence(?=\.net)
prefix=CARL
width=3
next_index=1

[hint.service-ids]
hint=svc-
prefix=SVC
width=4
next_index=10
