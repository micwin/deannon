# Beispiel-Konfig für Smokey-Tests
[direction_markers]
original=io.metafence,de.micwin

[full.base-domain]
original=io.metafence
anonymized=custA.example

[full.mgmt-namespace]
original=de.micwin.core
anonymized=tenant-42.core

# Hint-Muster sind reguläre Ausdrücke (case-insensitive)
[hint.namespaces]
hint=ns-prod-[a-z0-9]+
prefix=NSX
width=3
next_index=1

# Nur "metafence" vor ".net" ersetzen, restliche Domain bleibt erhalten
[hint.metafence]
hint=metafence(?=\.net)
prefix=CARL
width=3
next_index=1

[hint.service-ids]
hint=svc-
prefix=SVC
width=4
next_index=10
