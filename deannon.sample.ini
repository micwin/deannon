# Globale Marker: Wenn sie im Text vorkommen, gilt die Datei als „Original“
# und wird anonymisiert.
[direction_markers]
original=io.metafence,de.micwin

# Full-Paare: 1:1 Ersetzungen (case-insensitive) in beide Richtungen.
# Diese Einträge reichen bereits aus, um vollständig zu de/anonymisieren.
[full.base-domain]
original=io.metafence
anonymized=custA.example

[full.mgmt-namespace]
original=de.micwin.core
anonymized=tenant-42.core

# So sieht ein automatisch erzeugter Hint-Treffer aus. Neue Matches landen
# als weitere [full.*]-Sektionen in der Datei.
; [full.ns-prod-alpha]
; original=ns-prod-alpha
; anonymized=NSX001

# Hint-Definitionen verwenden reguläre Ausdrücke (case-insensitive).
# Dieses Beispiel ersetzt komplette Tokens „ns-prod-<id>“.
[hint.namespaces]
hint=ns-prod-[a-z0-9]+
prefix=NSX
width=3
next_index=1

# Hier nur den Teil „metafence“ direkt vor „.net“ ersetzen, Rest bleibt erhalten.
[hint.metafence]
hint=metafence(?=\.net)
prefix=CARL
width=3
next_index=1

[hint.service-ids]
hint=svc-
prefix=SVC
width=4
next_index=10

# Hinweise:
# - `next_index` wird bei jedem neuen Match hochgezählt.
# - Entferne die kommentierten Beispielsektionen, sobald reale Paare existieren.
