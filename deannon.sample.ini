# Global markers: if any of them appear, the file is treated as "original"
# and will be anonymized.
[direction_markers]
original=io.metafence,de.micwin

# Full pairs: case-insensitive 1:1 replacements, valid in both directions.
# A pure full list is already enough to anonymize/deanonymize.
[full.base-domain]
original=io.metafence
anonymized=custA.example

[full.mgmt-namespace]
original=de.micwin.core
anonymized=tenant-42.core

# Example of an auto-generated hint hit. New matches are appended
# as additional [full.*] sections.
; [full.ns-prod-alpha]
; original=ns-prod-alpha
; anonymized=NSX001

# Hint definitions use regular expressions (case-insensitive).
# This example replaces full tokens "ns-prod-<id>".
[hint.namespaces]
hint=ns-prod-[a-z0-9]+
prefix=NSX
width=3
next_index=1

# Replace only the part "metafence" right before ".net" so the remainder stays intact.
[hint.metafence]
hint=metafence(?=\.net)
prefix=CARL
width=3
next_index=1

[hint.service-ids]
hint=svc-
prefix=SVC
width=4
next_index=10

# Optional section to route generated entries into a dedicated YAML file
[generated_entries]
file=generated-full.ini

# Notes:
# - `next_index` is incremented for every new match.
# - Remove the commented example sections once real pairs exist.
